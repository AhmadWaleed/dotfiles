-- Conky config for Fedora GNOME.
-- Based on the layout/aesthetic of CaffeineOnIce's gist
-- (https://gist.github.com/CaffeineOnIce/4da72d18e20c9869895b31540e46b242),
-- adapted for modern conky syntax, AMD hardware (k10temp / amdgpu), and
-- extended with live RAM and GPU usage graphs.
--
-- __NET_IFACE__ is a placeholder substituted at launch time by
-- scripts/launch-conky.sh with the interface currently holding the
-- default route. Don't hand-edit __NET_IFACE__ directly; edit this file
-- and restart conky (systemctl --user restart conky) to re-resolve it.

conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'IBM Plex Mono:size=10.5',
    gap_x = 35,
    gap_y = 70,
    maximum_width = 270,
    minimum_width = 270,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_class = 'Conky',
    own_window_colour = '000000',
    own_window_hints = 'below,sticky,skip_taskbar,undecorated,skip_pager',
    own_window_transparent = true,
    own_window_type = 'dock',
    override_utf8_locale = true,
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    total_run_times = 0,
    update_interval = 1.0,
    uppercase = true,
    use_spacer = 'none',
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[
${font IBM Plex Mono:size=11}${color grey}${nodename}${alignr}${color}Fedora ${exec rpm -E %fedora}
${color grey}Kernel${alignr}${color}$kernel
${color grey}Uptime${alignr}${color}$uptime

${color grey}CPU ${alignr}${color}$cpu%
${color grey}${cpugraph cpu0 25,270 #d4a8ff #d4a8ff}
${font IBM Plex Mono:size=10.5}${color grey}Freq${alignr}${color}${freq_g 1} Ghz
${color grey}Temp${alignr}${color}${hwmon k10temp temp 1}°C

${font IBM Plex Mono:size=11}${color grey}RAM${font IBM Plex Mono:size=10.5}${alignr}${color}$mem / $memmax (${memperc}%)
${color grey}${memgraph 25,270 #a8d4ff #a8d4ff}

${font IBM Plex Mono:size=11}${color grey}GPU${alignr}${color}${execi 1 ~/.config/conky/scripts/gpu-busy.sh}%
${color grey}${execigraph 1 ~/.config/conky/scripts/gpu-busy.sh 25,270 #ffb3d9 #ffb3d9 100}
${font IBM Plex Mono:size=10.5}${color grey}Temp${alignr}${color}${hwmon amdgpu temp 1}°C
${color grey}VRAM${alignr}${color}${execi 2 ~/.config/conky/scripts/gpu-vram-used.sh}G / ${execi 30 ~/.config/conky/scripts/gpu-vram-total.sh}G
${color grey}${execigraph 1 ~/.config/conky/scripts/gpu-vram-percent.sh 15,270 #ffe28a #ffe28a 100}

${font IBM Plex Mono:size=11}${color grey}Root${goto 148}${color grey}Home
${color #BEC8CB}${fs_bar 5,125 /}${alignr}${fs_bar 5,125 /home}
${font IBM Plex Mono:size=10.5}${color grey}${fs_used /}/${fs_size /}${goto 148}${color grey}${fs_used /home}/${fs_size /home}
${font IBM Plex Mono:size=11}${color grey}Disk I/O
${color #9fb8c8}${diskiograph 15,270 #9fb8c8 #9fb8c8}

${font IBM Plex Mono:size=11}${color grey}Network${font IBM Plex Mono:size=10.5}${alignr}${color}${gw_iface}
${color grey}Up${goto 148}${color grey}Down
${color #BEC8CB}${upspeedgraph __NET_IFACE__ 25,125 #ffd4a8 #ffd4a8}${alignr}${downspeedgraph __NET_IFACE__ 25,125 #a8ffa8 #a8ffa8}
${color grey}${upspeedf __NET_IFACE__} KiB/s${goto 148}${color grey}${downspeedf __NET_IFACE__} KiB/s

${font IBM Plex Mono:size=11}${color grey}Battery${alignr}${color}${if_existing /sys/class/power_supply/BAT0/status Charging}${color #7CFC00}Charging${else}${if_existing /sys/class/power_supply/BAT0/status Discharging}${color #ffd000}Discharging${else}${if_existing /sys/class/power_supply/BAT0/status Full}${color #e46600}Full${endif}${endif}${endif}${color grey} ~ ${color}${battery_percent}%
${color #BEC8CB}${battery_bar 5}

${font IBM Plex Mono:size=11}${color grey}Processes${alignr}${color grey}PID
${font IBM Plex Mono:size=10.5}${color}${top name 1}${alignr}${top pid 1}
${color}${top name 2}${alignr}${top pid 2}
${color}${top name 3}${alignr}${top pid 3}
${color}${top name 4}${alignr}${top pid 4}
${color}${top name 5}${alignr}${top pid 5}
]]
