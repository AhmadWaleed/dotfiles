-- Conky config for Fedora GNOME.
-- Based on the layout/aesthetic of CaffeineOnIce's gist
-- (https://gist.github.com/CaffeineOnIce/4da72d18e20c9869895b31540e46b242),
-- adapted for modern conky syntax, AMD hardware (k10temp / amdgpu), and
-- extended with live RAM and GPU usage graphs.
--
-- __NET_IFACE__ is a placeholder substituted at launch time by
-- scripts/launch-conky.sh with the interface currently holding the
-- default route. Don't hand-edit __NET_IFACE__ directly; edit this file
-- and restart conky (systemctl --user restart conky) to re-resolve it.

conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'IBM Plex Mono:size=10.5',
    gap_x = 35,
    gap_y = 40,
    maximum_width = 270,
    minimum_width = 270,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_class = 'Conky',
    own_window_colour = '000000',
    own_window_hints = 'below,sticky,skip_taskbar,undecorated,skip_pager',
    own_window_transparent = true,
    own_window_type = 'dock',
    override_utf8_locale = true,
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    total_run_times = 0,
    update_interval = 1.0,
    uppercase = true,
    use_spacer = 'none',
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[
${color}Fedora ${exec rpm -E %fedora}${alignr}${color grey}Up ${color}${uptime_short}
${color grey}${kernel}
${voffset -4}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}CPU${goto 62}${color}${hwmon k10temp temp 1}°C${goto 140}${freq_g 1}GHz${alignr}${cpu}%
${cpugraph cpu0 22,270 #d4a8ff #d4a8ff}
${color grey}RAM${goto 62}${color}${mem} / ${memmax}${alignr}${memperc}%
${color grey}${memgraph 22,270 #a8d4ff #a8d4ff}
${color grey}GPU${goto 62}${color}${hwmon amdgpu temp 1}°C${alignr}${execi 1 ~/.config/conky/scripts/gpu-busy.sh}%
${color grey}${execigraph 1 ~/.config/conky/scripts/gpu-busy.sh 22,270 #ffb3d9 #ffb3d9 100}
${color grey}VRAM${goto 62}${color}${execi 2 ~/.config/conky/scripts/gpu-vram-used.sh}G / ${execi 30 ~/.config/conky/scripts/gpu-vram-total.sh}G${alignr}${execi 2 ~/.config/conky/scripts/gpu-vram-percent.sh}%
${color #ffe28a}${execibar 2 5,270 ~/.config/conky/scripts/gpu-vram-percent.sh}
${voffset -12}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Root${goto 62}${color}${fs_used_perc /}%${goto 148}${color grey}Home${goto 210}${color}${fs_used_perc /home}%
${color #BEC8CB}${fs_bar 5,125 /}${alignr}${fs_bar 5,125 /home}
${color}${fs_used /}/${fs_size /}${goto 148}${fs_used /home}/${fs_size /home}
${voffset 6}${color grey}Disk I/O${alignr}${color}${diskio_read} R  ${diskio_write} W
${diskiograph 15,270 #9fb8c8 #9fb8c8}
${voffset -6}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Net${goto 62}${color}${gw_iface}${alignr}${color grey}${addr __NET_IFACE__}
${color grey}Up${goto 62}${color}${upspeed __NET_IFACE__}${goto 148}${color grey}Down${goto 210}${color}${downspeed __NET_IFACE__}
${upspeedgraph __NET_IFACE__ 22,125 #ffd4a8 #ffd4a8}${alignr}${downspeedgraph __NET_IFACE__ 22,125 #a8ffa8 #a8ffa8}
${voffset -12}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Claude${alignr}${color}${execi 300 ~/.config/conky/scripts/claude-usage.py plan}
${color grey}Session${goto 90}${color}${execi 60 ~/.config/conky/scripts/claude-usage.py session_pct}%${goto 148}${color grey}Week${goto 210}${color}${execi 60 ~/.config/conky/scripts/claude-usage.py week_pct}%
${color #f0b8a0}${execibar 60 5,125 ~/.config/conky/scripts/claude-usage.py session_pct}${alignr}${execibar 60 5,125 ~/.config/conky/scripts/claude-usage.py week_pct}
${color}${execi 60 ~/.config/conky/scripts/claude-usage.py session_reset}${goto 148}${execi 60 ~/.config/conky/scripts/claude-usage.py week_reset}
${voffset -4}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Codex${alignr}${color}${execi 300 ~/.config/conky/scripts/codex-usage.py plan}
${color grey}Session${goto 90}${color}${execi 60 ~/.config/conky/scripts/codex-usage.py session_pct}%${goto 148}${color grey}Week${goto 210}${color}${execi 60 ~/.config/conky/scripts/codex-usage.py week_pct}%
${color #a8e6cf}${execibar 60 5,125 ~/.config/conky/scripts/codex-usage.py session_pct}${alignr}${execibar 60 5,125 ~/.config/conky/scripts/codex-usage.py week_pct}
${color}${execi 60 ~/.config/conky/scripts/codex-usage.py session_reset}${goto 148}${execi 60 ~/.config/conky/scripts/codex-usage.py week_reset}
${voffset -4}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Battery${alignr}${if_existing /sys/class/power_supply/BAT0/status Charging}${color #7CFC00}Charging${else}${if_existing /sys/class/power_supply/BAT0/status Discharging}${color #ffd000}Discharging${else}${if_existing /sys/class/power_supply/BAT0/status Full}${color #e46600}Full${endif}${endif}${endif}${color grey} ~ ${color}${battery_percent}%
${color #BEC8CB}${battery_bar 5}
${voffset -12}${font IBM Plex Mono:size=4}${color #3a3a3a}${hr 1}
${font}${color grey}Process${goto 170}CPU${alignr}MEM
${color}${top name 1}${goto 162}${top cpu 1}${alignr}${top mem 1}
${color}${top name 2}${goto 162}${top cpu 2}${alignr}${top mem 2}
${color}${top name 3}${goto 162}${top cpu 3}${alignr}${top mem 3}
${color}${top name 4}${goto 162}${top cpu 4}${alignr}${top mem 4}
${color}${top name 5}${goto 162}${top cpu 5}${alignr}${top mem 5}
]]
